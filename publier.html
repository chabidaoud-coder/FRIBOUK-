<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRIBOUK – Publier sur vos réseaux</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root { --vert:#1f5e46; --vert-clair:#e6f1ec; --encre:#1d2420; --gris:#68736d; --bord:#d5ddd8; --or:#b8821f; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f6f8f7; font-family:system-ui,sans-serif; color:var(--encre); }
  .rs { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.35rem; margin:0 0 4px; }
  p.aide { color:var(--gris); margin:0 0 16px; font-size:.92rem; }
  .bloc { background:#fff; border:1px solid var(--bord); border-radius:14px; padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:600; font-size:.9rem; margin:12px 0 6px; }
  textarea, select, input[type=number], input[type=url], input[type=datetime-local] {
    width:100%; padding:10px 12px; border:1px solid var(--bord); border-radius:10px; font:inherit; background:#fff; }
  textarea { min-height:110px; resize:vertical; }
  button { font:inherit; font-weight:600; border:0; border-radius:10px; padding:12px 16px; cursor:pointer;
           background:var(--vert); color:#fff; width:100%; margin-top:14px; }
  button.second { background:var(--vert-clair); color:var(--vert); margin-top:0; width:auto; padding:8px 12px; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid var(--or); outline-offset:2px; }
  .compte { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--bord); }
  .compte:last-child { border-bottom:0; }
  .vide, .bientot { color:var(--gris); font-size:.88rem; }
  .sponso { background:var(--vert-clair); border-radius:10px; padding:12px; margin-top:12px; display:none; }
  .sponso.actif { display:block; }
  .msg { margin-top:12px; font-size:.92rem; min-height:1.2em; }
  .msg.ok { color:var(--vert); } .msg.ko { color:#a3281c; }
  a.retour { display:inline-block; margin-bottom:12px; color:var(--vert); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<main class="rs">
  <a class="retour" href="index.html">← Retour à FRIBOUK</a>
  <h1>Publier sur vos réseaux</h1>
  <p class="aide">Connectez votre page, rédigez votre annonce, puis publiez ou sponsorisez.</p>

  <div class="bloc">
    <label for="rs-shop" style="margin-top:0">Boutique à connecter</label>
    <select id="rs-shop">
      <option value="boutique">Ma boutique</option>
      <option value="barka">BARKA</option>
      <option value="herboriste">HERBORISTE GUIYAGUI</option>
    </select>
    <button id="rs-fb">Connecter une page Facebook</button>
    <p class="bientot">TikTok et WhatsApp : bientôt disponibles.</p>
    <div id="rs-comptes"></div>
  </div>

  <div class="bloc">
    <label for="rs-compte" style="margin-top:0">Page de publication</label>
    <select id="rs-compte"></select>

    <label for="rs-texte">Texte de l'annonce</label>
    <textarea id="rs-texte" placeholder="Décrivez votre produit, son prix et comment commander."></textarea>

    <label for="rs-image">Adresse de la photo (optionnel)</label>
    <input type="url" id="rs-image" placeholder="https://…">

    <label for="rs-quand">Programmer pour plus tard (optionnel)</label>
    <input type="datetime-local" id="rs-quand">

    <label><input type="checkbox" id="rs-sponso"> Sponsoriser cette publication</label>
    <div class="sponso" id="rs-sponso-box">
      <label for="rs-budget" style="margin-top:0">Budget total (FCFA)</label>
      <input type="number" id="rs-budget" min="1000" step="500" value="5000">
      <p class="bientot">Le budget est enregistré avec la publication. La campagne payante sera lancée quand la pub Meta sera activée sur FRIBOUK.</p>
    </div>

    <button id="rs-publier">Publier</button>
    <div class="msg" id="rs-msg" role="status" aria-live="polite"></div>
  </div>
</main>

<script>
  // ====== À REMPLIR UNE SEULE FOIS ======
  // Copiez la valeur de FRIBOUK_KEY depuis votre script.js (la clé publique « anon / publishable »).
  const SUPABASE_URL = "https://rocvbxvxcxisyejrwzzx.supabase.co";
  const SUPABASE_KEY = "COLLEZ_ICI_FRIBOUK_KEY";
  // =======================================

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const FUNCTIONS = SUPABASE_URL + "/functions/v1";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const msg = (t, ok = true) => { const m = $("rs-msg"); m.textContent = t; m.className = "msg " + (ok ? "ok" : "ko"); };
  const token = async () => (await db.auth.getSession()).data.session?.access_token;

  async function chargerComptes() {
    const { data } = await db.from("social_accounts").select("*").order("created_at", { ascending: false });
    const liste = $("rs-comptes"), sel = $("rs-compte");
    liste.innerHTML = ""; sel.innerHTML = "";
    if (!data || !data.length) { liste.innerHTML = '<p class="vide">Aucune page connectée pour le moment.</p>'; return; }
    data.forEach((c) => {
      const ligne = document.createElement("div"); ligne.className = "compte";
      ligne.innerHTML = `<span>${esc(c.name)} <small>(${esc(c.shop)})</small></span>`;
      const b = document.createElement("button"); b.className = "second"; b.textContent = "Déconnecter";
      b.onclick = async () => { await db.from("social_accounts").delete().eq("id", c.id); chargerComptes(); };
      ligne.appendChild(b); liste.appendChild(ligne);
      const o = document.createElement("option"); o.value = c.id; o.textContent = `${c.name} — ${c.shop}`; sel.appendChild(o);
    });
  }

  $("rs-fb").onclick = async () => {
    const t = await token();
    if (!t) return msg("Connectez-vous d'abord à FRIBOUK (page d'accueil), puis revenez ici.", false);
    const r = await fetch(`${FUNCTIONS}/facebook-oauth?action=start&shop=${$("rs-shop").value}`,
      { headers: { Authorization: "Bearer " + t } });
    const j = await r.json();
    if (j.url) location.href = j.url; else msg("Connexion impossible. Réessayez.", false);
  };

  $("rs-sponso").onchange = (e) => $("rs-sponso-box").classList.toggle("actif", e.target.checked);

  $("rs-publier").onclick = async () => {
    const compte = $("rs-compte").value, texte = $("rs-texte").value.trim();
    if (!compte) return msg("Connectez d'abord une page Facebook.", false);
    if (!texte) return msg("Écrivez le texte de l'annonce.", false);
    const user = (await db.auth.getUser()).data.user;
    if (!user) return msg("Connectez-vous d'abord à FRIBOUK.", false);
    const quand = $("rs-quand").value;
    const sponso = $("rs-sponso").checked;

    const { data: post, error } = await db.from("social_posts").insert({
      user_id: user.id, account_id: compte, message: texte,
      image_url: $("rs-image").value || null,
      scheduled_at: quand ? new Date(quand).toISOString() : null,
      sponsored: sponso, budget_xof: sponso ? Number($("rs-budget").value) : null,
      status: quand ? "scheduled" : "draft",
    }).select().single();
    if (error) return msg("Enregistrement impossible : " + error.message, false);

    if (quand) return msg("Publication programmée.");
    msg("Publication en cours…");
    const r = await fetch(`${FUNCTIONS}/publish-post`, {
      method: "POST",
      headers: { Authorization: "Bearer " + (await token()), "Content-Type": "application/json" },
      body: JSON.stringify({ post_id: post.id }),
    });
    const j = await r.json();
    j.ok ? msg("Publié sur Facebook.") : msg(j.error || "Échec de la publication.", false);
  };

  const q = new URLSearchParams(location.search).get("social");
  if (q === "facebook_ok") msg("Page Facebook connectée.");
  if (q === "erreur") msg("La connexion Facebook a échoué.", false);
  if (q === "annule") msg("Connexion annulée.", false);

  chargerComptes();
</script>
</body>
  </html>
