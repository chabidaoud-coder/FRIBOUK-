
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>FRIBOUK — Votre intelligence artificielle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>FRIBOUK</h1>
    <p>Votre espace d'intelligence artificielle</p>
  </header>

  <main>
    <section class="accueil">
      <h2>Bienvenue sur FRIBOUK</h2>
      <p>Créez, apprenez, analysez et développez vos idées.</p>
      <button id="commencer">Commencer</button>
    </section>

    <section id="outils">
      <h2>Bienvenue sur FRIBOUK</h2>
      <p>Votre espace d'intelligence artificielle.</p>

      <button class="outil">IA Chat</button>
      <button class="outil">Générateur de textes</button>
      <button class="outil">Générateur d'images</button>
      <button class="outil">Générateur de vidéos</button>
      <button class="outil">Traduction</button>
      <button class="outil">Transcription audio</button>
    
    </section>

    <section id="zone-chat" style="display:none; padding:20px;">
      <h2>FRIBOUK — IA Chat</h2>

      <div id="messages-chat"
           style="min-height:150px; padding:10px; border:1px solid #ccc; border-radius:8px;">
        <p>Bienvenue ! Écris ton message ci-dessous.</p>
      </div>

      <textarea id="saisie-chat"
                placeholder="Écris ton message ici..."
                rows="3"
                style="width:100%; margin-top:10px;"></textarea>

      <button id="envoyer-chat" type="button">
        Envoyer
      </button>

      <button id="fermer-chat" type="button">
        Fermer le chat
      </button>
    </section>
  </main>


  <footer>
    <p>© FRIBOUK — Tous droits réservés</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
