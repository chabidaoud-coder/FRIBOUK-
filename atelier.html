<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071427">
<title>FRIBOUK – Shortcut Atelier Design</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&family=Oswald:wght@500;700&family=Playfair+Display:wght@700&family=Poppins:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{--fond:#071427;--carte:#0f2745;--bord:#2b4a6f;--texte:#eaf1f8;--doux:#9db3c9;--arg:#c9d3dd;--bleu:#3b82c4;--rouge:#ff8a7a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fond);color:var(--texte);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding-bottom:210px}
  .haut{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(7,20,39,.95);border-bottom:1px solid var(--bord)}
  .haut a{color:var(--arg);text-decoration:none;font-weight:700;font-size:1.3rem;padding-right:6px}
  .haut h1{font-size:1.05rem;margin:0;flex:1}
  #solde{font-size:.78rem;padding:5px 10px;border:1px solid var(--arg);border-radius:999px;color:var(--arg)}
  main{max-width:640px;margin:0 auto;padding:16px}
  h2{font-size:1.05rem;margin:0 0 12px}
  .grille{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .tuile{font:inherit;color:var(--texte);background:var(--carte);border:1px solid var(--bord);border-radius:16px;padding:14px;text-align:center;cursor:pointer;min-height:110px}
  .tuile .i{font-size:2rem;display:block}
  .tuile small{display:block;color:var(--doux);margin-top:4px}
  .tuile img{width:100%;border-radius:8px;display:block;margin-bottom:8px;background:#fff}
  .retour{background:none;border:0;color:var(--arg);font:inherit;font-weight:700;padding:0 0 12px;cursor:pointer}
  #zone{display:flex;justify-content:center}
  #zone .canvas-container{border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  .btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;color:#071427;background:linear-gradient(135deg,#f6f8fb,#a9b5c3 55%,#e6ebf0)}
  .btn.contour{background:transparent;color:var(--arg);border:1px solid var(--arg)}
  .btn.rouge{background:transparent;color:var(--rouge);border:1px solid var(--rouge)}
  .btn.p{padding:8px 11px;font-size:.88rem}
  .bas{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(7,20,39,.97);border-top:1px solid var(--bord);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
  .ctx{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;max-height:130px;overflow:auto}
  .ctx textarea{width:100%;min-height:44px;background:var(--carte);color:var(--texte);border:1px solid var(--bord);border-radius:10px;padding:8px;font:inherit}
  .ctx select,.ctx input[type=color]{background:var(--carte);color:var(--texte);border:1px solid var(--bord);border-radius:10px;padding:6px;font:inherit;height:36px}
  .ctx input[type=color]{width:44px;padding:2px}
  .ctx input[type=range]{width:90px}
  .barre{display:flex;gap:8px;overflow-x:auto}
  .barre .btn{flex:none}
  #modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
  #modal .boite{background:var(--carte);border:1px solid var(--arg);border-radius:16px;padding:18px;max-width:420px;width:100%}
  #modal .btn{display:block;width:100%;margin-top:10px}
  #msg{position:fixed;left:12px;right:12px;top:64px;z-index:30;padding:10px;border-radius:12px;background:var(--carte);border:1px solid var(--bord);text-align:center}
  #msg.ko{color:var(--rouge);border-color:var(--rouge)}
  [hidden]{display:none !important}
  :focus-visible{outline:3px solid var(--arg);outline-offset:2px}
</style>
</head>
<body>
<header class="haut">
  <a href="index.html" aria-label="Retour à FRIBOUK">←</a>
  <h1>Shortcut · Atelier Design</h1>
  <span id="solde" hidden></span>
</header>
<main>
  <section id="v-format"><h2>Que voulez-vous créer ?</h2><div class="grille" id="l-format"></div></section>
  <section id="v-modele" hidden><button class="retour" id="r-format" type="button">← Formats</button><h2>Choisissez un modèle</h2><div class="grille" id="l-modele"></div></section>
  <section id="v-editeur" hidden><button class="retour" id="r-modele" type="button">← Modèles</button><div id="zone"></div></section>
</main>

<div class="bas" id="bas" hidden>
  <div class="ctx" id="ctx" hidden>
    <textarea id="p-texte" placeholder="Modifier le texte"></textarea>
    <select id="p-police" aria-label="Police"></select>
    <input id="p-taille" type="range" min="8" max="140" aria-label="Taille">
    <input id="p-couleur" type="color" aria-label="Couleur">
    <button class="btn p contour" id="p-gras" type="button"><b>G</b></button>
    <button class="btn p contour" id="p-ital" type="button"><i>I</i></button>
    <button class="btn p contour" id="p-g" type="button">⇤</button>
    <button class="btn p contour" id="p-c" type="button">↔</button>
    <button class="btn p contour" id="p-d" type="button">⇥</button>
    <button class="btn p contour" id="p-ronde" type="button">Photo ronde</button>
    <button class="btn p contour" id="p-avant" type="button">Devant</button>
    <button class="btn p contour" id="p-arriere" type="button">Derrière</button>
    <button class="btn p contour" id="p-dup" type="button">Dupliquer</button>
    <button class="btn p rouge" id="p-sup" type="button">Supprimer</button>
  </div>
  <div class="barre">
    <button class="btn p" id="a-texte" type="button">+ Texte</button>
    <button class="btn p" id="a-photo" type="button">+ Photo</button>
    <button class="btn p" id="a-rect" type="button">+ Forme</button>
    <button class="btn p" id="a-cercle" type="button">+ Cercle</button>
    <button class="btn p" id="a-stk" type="button">+ Étiquette</button>
    <button class="btn p" id="a-fond" type="button">Fond</button>
    <button class="btn p contour" id="x-png" type="button">PNG</button>
    <button class="btn p contour" id="x-jpg" type="button">JPG</button>
    <button class="btn p contour" id="x-pdf" type="button">PDF</button>
  </div>
</div>
<input type="file" id="f-photo" accept="image/*" hidden>
<input type="color" id="f-fond" hidden>
<div id="modal" hidden></div>
<div id="msg" role="status" aria-live="polite" hidden></div>

<script>
  const SUPABASE_URL = "https://rocvbxvxcxisyejrwzzx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_0KUOpiRmTZ4SpQQIS-5iZw_K6fOyWOh";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const FUNCTIONS = SUPABASE_URL + "/functions/v1";
  const $ = (id) => document.getElementById(id);
  const C = { nuit: "#0b1f3a", acier: "#2f5d8a", bleu: "#3b82c4", clair: "#eef2f6", arg: "#c9d3dd" };
  const POLICES = ["Poppins", "Montserrat", "Playfair Display", "Oswald", "Dancing Script"];
  const FORMATS = [
    { id: "flyer", nom: "Flyer A5", ico: "📄", w: 420, h: 595, mm: [148, 210], mult: 4 },
    { id: "affiche", nom: "Affiche A4", ico: "🖼️", w: 420, h: 594, mm: [210, 297], mult: 5 },
    { id: "carte", nom: "Carte de visite", ico: "💳", w: 360, h: 200, mm: [90, 50], mult: 3 },
    { id: "carre", nom: "Post carré", ico: "🟦", w: 400, h: 400, mm: [150, 150], mult: 2.7 },
    { id: "story", nom: "Story / Reel", ico: "📱", w: 360, h: 640, mm: [90, 160], mult: 3 },
    { id: "couv", nom: "Couverture Facebook", ico: "🌐", w: 410, h: 156, mm: [205, 78], mult: 2 }
  ];

  /* ---------- Outils de dessin ---------- */
  const grad = (w, h, s) => new fabric.Gradient({ type: "linear", coords: { x1: 0, y1: 0, x2: w, y2: h }, colorStops: s.map((c, i) => ({ offset: i / (s.length - 1), color: c })) });
  const argent = (w, h) => grad(w, h, ["#f6f8fb", "#a9b5c3", "#e6ebf0", "#9fabba"]);
  const nuit = (w, h) => grad(w, h, ["#071427", "#0b1f3a", "#2f5d8a"]);
  const T = (t, o) => new fabric.Textbox(t, Object.assign({ fontFamily: "Poppins", fill: "#ffffff", fontSize: 16, textAlign: "left" }, o));
  const R = (o) => new fabric.Rect(o);
  const O = (o) => new fabric.Circle(o);
  const fond = (W, H, f) => R({ left: 0, top: 0, width: W, height: H, fill: f });
  const FL = ["flyer", "affiche", "carre", "story"];

  const MODELES = [
    { id: "promo", nom: "Promo bleu argenté", f: FL, b: (W, H) => [
      fond(W, H, nuit(W, H)),
      O({ left: W * .55, top: -W * .25, radius: W * .45, fill: "#ffffff", opacity: .07 }),
      R({ left: 0, top: 0, width: W, height: H * .2, fill: argent(W, H * .2) }),
      T("VOTRE TITRE ICI", { left: 20, top: H * .055, width: W - 40, fontFamily: "Oswald", fontWeight: "700", fontSize: W * .1, fill: C.nuit, textAlign: "center" }),
      T("Un sous-titre qui donne envie", { left: 20, top: H * .24, width: W - 40, fontFamily: "Montserrat", fontSize: W * .05, fill: "#dfe7ef", textAlign: "center" }),
      T("✔ Qualité garantie\n✔ Livraison rapide\n✔ Prix doux", { left: 24, top: H * .4, width: W * .55, fontSize: W * .05, lineHeight: 1.5 }),
      O({ left: W * .62, top: H * .5, radius: W * .16, fill: argent(W * .32, W * .32) }),
      T("5 000\nFCFA", { left: W * .62, top: H * .5 + W * .09, width: W * .32, fontFamily: "Oswald", fontWeight: "700", fontSize: W * .07, fill: C.nuit, textAlign: "center", lineHeight: .95 }),
      R({ left: 0, top: H * .9, width: W, height: H * .1, fill: C.bleu }),
      T("📞 +229 00 00 00 00 · Parakou", { left: 10, top: H * .93, width: W - 20, fontSize: W * .04, textAlign: "center" })] },
    { id: "elegant", nom: "Élégance argent", f: FL, b: (W, H) => [
      fond(W, H, argent(W, H)),
      R({ left: 12, top: 12, width: W - 24, height: H - 24, fill: "rgba(0,0,0,0)", stroke: C.acier, strokeWidth: 3, rx: 10, ry: 10 }),
      T("Votre titre élégant", { left: 30, top: H * .1, width: W - 60, fontFamily: "Playfair Display", fontWeight: "700", fontSize: W * .09, fill: C.nuit, textAlign: "center" }),
      R({ left: W * .35, top: H * .28, width: W * .3, height: 3, fill: C.bleu }),
      T("Sous-titre ou slogan de votre activité", { left: 30, top: H * .32, width: W - 60, fontFamily: "Montserrat", fontSize: W * .045, fill: C.acier, textAlign: "center" }),
      T("Décrivez ici votre offre, vos services ou votre événement en quelques lignes claires et accrocheuses.", { left: 36, top: H * .46, width: W - 72, fontSize: W * .04, fill: "#1d2f45", textAlign: "center", lineHeight: 1.5 }),
      R({ left: 12, top: H * .84, width: W - 24, height: H * .16 - 12, fill: nuit(W, H * .16) }),
      T("Contactez-nous · +229 00 00 00 00", { left: 20, top: H * .84 + (H * .16 - 12) / 2 - W * .02, width: W - 40, fontSize: W * .042, fill: "#dfe7ef", textAlign: "center" })] },
    { id: "event", nom: "Événement diagonal", f: FL, b: (W, H) => [
      fond(W, H, C.clair),
      new fabric.Polygon([{ x: 0, y: 0 }, { x: W, y: 0 }, { x: W, y: H * .5 }, { x: 0, y: H * .6 }], { left: 0, top: 0, fill: nuit(W, H * .6) }),
      T("ÉVÉNEMENT", { left: 20, top: H * .12, width: W - 40, fontFamily: "Oswald", fontWeight: "700", fontSize: W * .15, fill: argent(W, W * .2), textAlign: "center" }),
      T("Samedi 12 décembre · 16h", { left: 20, top: H * .32, width: W - 40, fontFamily: "Montserrat", fontSize: W * .05, textAlign: "center" }),
      T("Lieu : Parakou, Bénin\nEntrée libre", { left: 20, top: H * .66, width: W - 40, fontSize: W * .05, fill: C.nuit, textAlign: "center", lineHeight: 1.5 }),
      R({ left: W * .2, top: H * .82, width: W * .6, height: H * .075, rx: 20, ry: 20, fill: C.bleu }),
      T("Réservez maintenant", { left: W * .2, top: H * .82 + H * .02, width: W * .6, fontSize: W * .045, fontWeight: "700", textAlign: "center" }),
      T("📞 +229 00 00 00 00", { left: 20, top: H * .93, width: W - 40, fontSize: W * .04, fill: C.acier, textAlign: "center" })] },
    { id: "cartepro", nom: "Carte pro nuit", f: ["carte"], b: (W, H) => [
      fond(W, H, nuit(W, H)),
      R({ left: 0, top: 0, width: W * .035, height: H, fill: argent(W * .035, H) }),
      T("Prénom NOM", { left: W * .09, top: H * .16, width: W * .6, fontFamily: "Montserrat", fontWeight: "800", fontSize: H * .15 }),
      T("Votre fonction", { left: W * .09, top: H * .36, width: W * .6, fontSize: H * .085, fill: C.arg }),
      T("📞 +229 00 00 00 00\n✉️ vous@email.com\n📍 Parakou, Bénin", { left: W * .09, top: H * .56, width: W * .7, fontSize: H * .075, lineHeight: 1.45 }),
      O({ left: W * .76, top: H * .12, radius: H * .13, fill: argent(H * .26, H * .26) }),
      T("FR", { left: W * .76, top: H * .12 + H * .06, width: H * .26, fontFamily: "Montserrat", fontWeight: "800", fontSize: H * .12, fill: C.nuit, textAlign: "center" })] },
    { id: "carteclair", nom: "Carte argent", f: ["carte"], b: (W, H) => [
      fond(W, H, argent(W, H)),
      R({ left: 0, top: H * .74, width: W, height: H * .26, fill: C.bleu }),
      T("Prénom NOM", { left: W * .07, top: H * .14, width: W * .86, fontFamily: "Playfair Display", fontWeight: "700", fontSize: H * .15, fill: C.nuit }),
      T("Votre fonction", { left: W * .07, top: H * .36, width: W * .86, fontSize: H * .085, fill: C.acier }),
      R({ left: W * .07, top: H * .5, width: W * .2, height: 2, fill: C.acier }),
      T("📍 Parakou, Bénin", { left: W * .07, top: H * .58, width: W * .86, fontSize: H * .075, fill: C.nuit }),
      T("📞 +229 00 00 00 00    ✉️ vous@email.com", { left: 10, top: H * .74 + H * .09, width: W - 20, fontSize: H * .07, textAlign: "center" })] },
    { id: "couv", nom: "Couverture bleu argent", f: ["couv"], b: (W, H) => [
      fond(W, H, nuit(W, H)),
      R({ left: 0, top: H * .92, width: W, height: H * .08, fill: argent(W, H * .08) }),
      T("NOM DE VOTRE BOUTIQUE", { left: 20, top: H * .16, width: W - 40, fontFamily: "Oswald", fontWeight: "700", fontSize: H * .26, fill: argent(W, H * .3), textAlign: "center" }),
      T("Produits · Livraison · Qualité", { left: 20, top: H * .58, width: W - 40, fontFamily: "Montserrat", fontSize: H * .1, fill: "#dfe7ef", textAlign: "center" }),
      T("📞 +229 00 00 00 00", { left: 20, top: H * .76, width: W - 40, fontSize: H * .08, fill: C.arg, textAlign: "center" })] }
  ];

  const STICKERS = {
    "PROMO": () => [O({ radius: 38, fill: argent(76, 76), originX: "center", originY: "center" }), T("PROMO", { width: 76, left: -38, top: -11, fontFamily: "Oswald", fontWeight: "700", fontSize: 22, fill: C.nuit, textAlign: "center" })],
    "NOUVEAU": () => [R({ width: 120, height: 36, rx: 18, ry: 18, fill: C.bleu, originX: "center", originY: "center" }), T("NOUVEAU", { width: 120, left: -60, top: -10, fontFamily: "Oswald", fontWeight: "700", fontSize: 20, textAlign: "center" })],
    "-20%": () => [O({ radius: 36, fill: C.acier, originX: "center", originY: "center" }), T("-20%", { width: 72, left: -36, top: -13, fontFamily: "Oswald", fontWeight: "700", fontSize: 26, textAlign: "center" })],
    "Livraison gratuite": () => [R({ width: 190, height: 34, rx: 8, ry: 8, fill: C.nuit, stroke: C.arg, strokeWidth: 2, originX: "center", originY: "center" }), T("Livraison gratuite", { width: 190, left: -95, top: -10, fontSize: 17, textAlign: "center" })],
    "WhatsApp": () => [R({ width: 190, height: 34, rx: 17, ry: 17, fill: "#1f9d55", originX: "center", originY: "center" }), T("WhatsApp : 00 00 00 00", { width: 190, left: -95, top: -9, fontSize: 15, textAlign: "center" })]
  };

  /* ---------- Utilitaires ---------- */
  let canvas = null, fmt = null, zoom = 1, minuteur = null;
  const el = (t, a = {}, ...k) => {
    const n = document.createElement(t);
    for (const [x, v] of Object.entries(a)) { if (x === "class") n.className = v; else if (x.startsWith("on")) n[x] = v; else n.setAttribute(x, v); }
    n.append(...k.filter((c) => c !== null && c !== undefined && c !== false));
    return n;
  };
  const dire = (t, ok = true) => { const m = $("msg"); m.textContent = t; m.className = ok ? "" : "ko"; m.hidden = false; clearTimeout(minuteur); minuteur = setTimeout(() => { m.hidden = true; }, 4000); };
  const montrer = (id) => { ["v-format", "v-modele", "v-editeur"].forEach((v) => { $(v).hidden = v !== id; }); $("bas").hidden = id !== "v-editeur"; window.scrollTo(0, 0); };
  const polices = () => Promise.all(POLICES.map((p) => document.fonts.load("700 20px '" + p + "'").catch(() => null)));

  /* ---------- Écrans ---------- */
  function voirFormats() {
    const l = $("l-format"); l.replaceChildren();
    FORMATS.forEach((f) => l.append(el("button", { class: "tuile", type: "button", onclick: () => voirModeles(f) },
      el("span", { class: "i" }, f.ico), el("strong", {}, f.nom), el("small", {}, f.mm[0] + " × " + f.mm[1] + " mm"))));
    montrer("v-format");
  }

  async function voirModeles(f) {
    fmt = f; const l = $("l-modele"); l.replaceChildren(el("p", {}, "Chargement…")); montrer("v-modele");
    await polices(); l.replaceChildren();
    MODELES.filter((m) => m.f.includes(f.id)).forEach((m) => {
      const z = 150 / f.w, sc = new fabric.StaticCanvas(null, { width: f.w * z, height: f.h * z });
      sc.setZoom(z); m.b(f.w, f.h).forEach((o) => sc.add(o)); sc.renderAll();
      const url = sc.toDataURL({ format: "png" }); sc.dispose();
      l.append(el("button", { class: "tuile", type: "button", onclick: () => ouvrir(m) }, el("img", { src: url, alt: "" }), el("strong", {}, m.nom)));
    });
  }

  async function ouvrir(m) {
    montrer("v-editeur");
    const zone = $("zone"); zone.replaceChildren(el("canvas", { id: "cv" }));
    if (canvas) canvas.dispose();
    await polices();
    zoom = Math.min(Math.max(Math.min(zone.clientWidth, 560), 200) / fmt.w, 1.6);
    canvas = new fabric.Canvas("cv", { preserveObjectStacking: true, selection: false });
    canvas.setZoom(zoom); canvas.setDimensions({ width: fmt.w * zoom, height: fmt.h * zoom });
    m.b(fmt.w, fmt.h).forEach((o, i) => { if (i === 0) o.set({ selectable: false, evented: false }); canvas.add(o); });
    canvas.renderAll();
    ["selection:created", "selection:updated", "selection:cleared"].forEach((e) => canvas.on(e, majPanneau));
    majPanneau(); majSolde();
  }
/* ---------- Panneau de réglages ---------- */
  const estTexte = (o) => o && (o.type === "textbox" || o.type === "i-text");
  function majPanneau() {
    const o = canvas.getActiveObject(); $("ctx").hidden = !o; if (!o) return;
    const t = estTexte(o), img = o.type === "image";
    ["p-texte", "p-police", "p-taille", "p-gras", "p-ital", "p-g", "p-c", "p-d"].forEach((i) => { $(i).hidden = !t; });
    $("p-ronde").hidden = !img;
    $("p-couleur").hidden = img;
    if (t) { $("p-texte").value = o.text; $("p-police").value = o.fontFamily; $("p-taille").value = Math.round(o.fontSize * (o.scaleY || 1)); }
    const f = o.fill; $("p-couleur").value = typeof f === "string" && /^#[0-9a-f]{6}$/i.test(f) ? f : "#3b82c4";
  }
  const sur = (fn) => () => { const o = canvas && canvas.getActiveObject(); if (o) { fn(o); canvas.requestRenderAll(); } };
  POLICES.forEach((p) => $("p-police").append(el("option", { value: p }, p)));
  $("p-texte").oninput = sur((o) => { if (estTexte(o)) o.set("text", $("p-texte").value); });
  $("p-police").onchange = sur((o) => o.set("fontFamily", $("p-police").value));
  $("p-taille").oninput = sur((o) => o.set({ fontSize: +$("p-taille").value, scaleX: 1, scaleY: 1 }));
  $("p-couleur").oninput = sur((o) => o.set("fill", $("p-couleur").value));
  $("p-gras").onclick = sur((o) => o.set("fontWeight", o.fontWeight === "700" || o.fontWeight === "bold" ? "400" : "700"));
  $("p-ital").onclick = sur((o) => o.set("fontStyle", o.fontStyle === "italic" ? "normal" : "italic"));
  $("p-g").onclick = sur((o) => o.set("textAlign", "left"));
  $("p-c").onclick = sur((o) => o.set("textAlign", "center"));
  $("p-d").onclick = sur((o) => o.set("textAlign", "right"));
  $("p-avant").onclick = sur((o) => canvas.bringForward(o));
  $("p-arriere").onclick = sur((o) => { canvas.sendBackwards(o); if (canvas.getObjects()[0] !== o) return; canvas.bringForward(o); });
  $("p-sup").onclick = sur((o) => { canvas.remove(o); canvas.discardActiveObject(); });
  $("p-dup").onclick = () => { const o = canvas.getActiveObject(); if (!o) return; o.clone((c) => { c.set({ left: o.left + 15, top: o.top + 15 }); canvas.add(c); canvas.setActiveObject(c); canvas.requestRenderAll(); }); };
  $("p-ronde").onclick = sur((o) => {
    if (o.clipPath) o.set("clipPath", null);
    else o.set("clipPath", new fabric.Circle({ radius: Math.min(o.width, o.height) / 2, originX: "center", originY: "center" }));
  });

  /* ---------- Ajouts ---------- */
  const ajouter = (o) => { canvas.add(o); o.setCoords(); canvas.setActiveObject(o); canvas.requestRenderAll(); };
  $("a-texte").onclick = () => ajouter(T("Votre texte", { left: fmt.w * .1, top: fmt.h * .4, width: fmt.w * .8, fontSize: fmt.w * .07, fill: C.bleu, fontWeight: "700", textAlign: "center" }));
  $("a-rect").onclick = () => ajouter(R({ left: fmt.w * .2, top: fmt.h * .4, width: fmt.w * .6, height: fmt.h * .12, rx: 10, ry: 10, fill: C.bleu }));
  $("a-cercle").onclick = () => ajouter(O({ left: fmt.w * .3, top: fmt.h * .4, radius: fmt.w * .12, fill: C.arg }));
  $("a-photo").onclick = () => $("f-photo").click();
  $("f-photo").onchange = () => {
    const f = $("f-photo").files[0]; $("f-photo").value = "";
    if (!f) return;
    if (!f.type.startsWith("image/") || f.size > 8 * 1024 * 1024) return dire("Choisissez une image de 8 Mo maximum.", false);
    const r = new FileReader();
    r.onload = () => fabric.Image.fromURL(r.result, (img) => {
      img.scale(Math.min((fmt.w * .6) / img.width, (fmt.h * .5) / img.height));
      img.set({ left: fmt.w * .2, top: fmt.h * .25 }); ajouter(img);
    });
    r.readAsDataURL(f);
  };
  $("a-stk").onclick = () => {
    const boite = el("div", { class: "boite" }, el("h2", {}, "Choisissez une étiquette"));
    Object.keys(STICKERS).forEach((nom) => boite.append(el("button", { class: "btn", type: "button", onclick: () => {
      const g = new fabric.Group(STICKERS[nom](), { left: fmt.w * .5 - 60, top: fmt.h * .3 }); $("modal").hidden = true; ajouter(g);
    } }, nom)));
    boite.append(el("button", { class: "btn contour", type: "button", onclick: () => { $("modal").hidden = true; } }, "Fermer"));
    $("modal").replaceChildren(boite); $("modal").hidden = false;
  };
  $("a-fond").onclick = () => $("f-fond").click();
  $("f-fond").oninput = () => { const b = canvas.getObjects()[0]; if (b) { b.set("fill", $("f-fond").value); canvas.requestRenderAll(); } };

  /* ---------- Points, abonnement, export ---------- */
  async function majSolde() {
    const s = $("solde"); const { data: { session } } = await db.auth.getSession();
    if (!session) { s.hidden = true; return; }
    const { data } = await db.rpc("atelier_solde");
    if (!data) return;
    s.hidden = false;
    s.textContent = data.abonne ? "✅ Abonné" : "⭐ " + data.reste + " pts";
  }

  async function payer(code) {
    try {
      const { data: { session } } = await db.auth.getSession();
      const r = await fetch(FUNCTIONS + "/paiement", { method: "POST", headers: { Authorization: "Bearer " + session.access_token, "Content-Type": "application/json" }, body: JSON.stringify({ action: "creer", offre: code }) });
      const j = await r.json();
      if (j.url) location.href = j.url; else dire(j.erreur || "Paiement impossible.", false);
    } catch (e) { dire("Problème de réseau. Réessayez.", false); }
  }

  async function proposerAbonnement() {
    const boite = el("div", { class: "boite" }, el("h2", {}, "Vos points du jour sont épuisés"),
      el("p", { style: "color:#9db3c9;margin:0" }, "Choisissez un abonnement Atelier pour continuer sans limite. Après le paiement, revenez sur cette page."));
    const { data } = await db.from("offres").select("code,libelle,prix_xof").eq("type", "atelier").eq("actif", true).order("prix_xof");
    (data || []).forEach((o) => boite.append(el("button", { class: "btn", type: "button", onclick: () => payer(o.code) }, o.libelle + " : " + o.prix_xof.toLocaleString("fr-FR") + " FCFA")));
    boite.append(el("button", { class: "btn contour", type: "button", onclick: () => { $("modal").hidden = true; } }, "Plus tard"));
    $("modal").replaceChildren(boite); $("modal").hidden = false;
  }

  async function autoriser() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { dire("Connectez-vous à FRIBOUK pour télécharger votre création.", false); return false; }
    const { data, error } = await db.rpc("atelier_depenser", { p_action: "design_export" });
    if (error) { dire("Vérification impossible : " + error.message, false); return false; }
    if (!data.ok) { proposerAbonnement(); return false; }
    majSolde(); return true;
  }

  async function exporter(type) {
    if (!(await autoriser())) return;
    canvas.discardActiveObject(); canvas.renderAll();
    canvas.setZoom(1); canvas.setDimensions({ width: fmt.w, height: fmt.h });
    const url = canvas.toDataURL({ format: type === "jpg" ? "jpeg" : "png", quality: .95, multiplier: fmt.mult });
    canvas.setZoom(zoom); canvas.setDimensions({ width: fmt.w * zoom, height: fmt.h * zoom });
    const nom = "fribouk-" + fmt.id;
    if (type === "pdf") {
      const [w, h] = fmt.mm, pdf = new window.jspdf.jsPDF({ unit: "mm", format: [w, h], orientation: w > h ? "l" : "p" });
      pdf.addImage(url, type === "jpg" ? "JPEG" : "PNG", 0, 0, w, h); pdf.save(nom + ".pdf");
    } else { const a = document.createElement("a"); a.href = url; a.download = nom + "." + type; a.click(); }
    dire("Téléchargement lancé.");
  }
  $("x-png").onclick = () => exporter("png");
  $("x-jpg").onclick = () => exporter("jpg");
  $("x-pdf").onclick = () => exporter("pdf");

  $("r-format").onclick = voirFormats;
  $("r-modele").onclick = () => voirModeles(fmt);
  voirFormats(); majSolde();
</script>
</body>
</html>
