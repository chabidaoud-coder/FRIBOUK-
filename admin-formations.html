<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2620">
<meta name="robots" content="noindex">
<title>FRIBOUK – Approbations formations</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{--fond:#0b2620;--carte:#12372f;--carte2:#0f2f28;--bord:#25544a;--texte:#eef5f2;--doux:#a9c2ba;--or:#e8b64a;--vert:#2a9d78;--rouge:#ff8a7a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fond);color:var(--texte);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;padding-bottom:40px}
  .haut{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(11,38,32,.94);border-bottom:1px solid var(--bord)}
  .haut a{color:var(--or);text-decoration:none;font-weight:700;font-size:1.3rem;padding:6px 10px 6px 0}
  .haut h1{font-size:1.1rem;margin:0}
  main{max-width:640px;margin:0 auto;padding:16px}
  .carte{background:var(--carte);border:1px solid var(--bord);border-radius:16px;padding:16px;margin-bottom:14px}
  .carte h2{font-size:1.05rem;margin:0 0 8px}
  .item{background:var(--carte2);border:1px solid var(--bord);border-radius:12px;padding:12px;margin-top:10px}
  .item h3{margin:0 0 4px;font-size:1rem}
  .doux{color:var(--doux);font-size:.9rem;margin:4px 0 0;word-break:break-word}
  .btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--or);color:#1c1604}
  .btn.contour{background:transparent;color:var(--rouge);border:1px solid var(--rouge)}
  .btn:disabled{opacity:.55}
  .rang{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  a.lien{color:var(--or);display:inline-block;margin:6px 12px 0 0}
  .msg{min-height:1.2em;margin-top:10px;font-size:.92rem}
  .msg.ok{color:#7be0b8}.msg.ko{color:var(--rouge)}
  [hidden]{display:none !important}
  :focus-visible{outline:3px solid var(--or);outline-offset:2px}
</style>
</head>
<body>
<header class="haut">
  <a href="index.html" aria-label="Retour à FRIBOUK">←</a>
  <h1>Approbations formations</h1>
</header>
<main>
  <p class="msg" id="etat" role="status" aria-live="polite">Vérification de votre accès…</p>
  <div id="contenu" hidden>
    <section class="carte">
      <h2>Demandes d'espace formateur</h2>
      <div id="demandes"></div>
    </section>
    <section class="carte">
      <h2>Formations à approuver</h2>
      <div id="formations"></div>
    </section>
  </div>
</main>

<script>
  const SUPABASE_URL = "https://rocvbxvxcxisyejrwzzx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_0KUOpiRmTZ4SpQQIS-5iZw_K6fOyWOh";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = (id) => document.getElementById(id);
  const MODES = { en_ligne: "En ligne", presentiel: "Présentiel", les_deux: "En ligne et présentiel" };
  const FORMATS = { pdf: "PDF", video: "Vidéo", presentiel: "Présentiel" };

  const el = (t, a = {}, ...k) => {
    const n = document.createElement(t);
    for (const [x, v] of Object.entries(a)) {
      if (x === "class") n.className = v; else if (x.startsWith("on")) n[x] = v; else n.setAttribute(x, v);
    }
    n.append(...k.filter((c) => c !== null && c !== undefined && c !== false));
    return n;
  };
  const lienSur = (u) => { try { const x = new URL(u); return x.protocol === "https:" ? x.href : null; } catch (e) { return null; } };
  const dire = (t, ok = true) => { const m = $("etat"); m.className = "msg " + (ok ? "ok" : "ko"); m.textContent = t; };

  async function init() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) return dire("Connectez-vous d'abord à FRIBOUK, puis revenez ici.", false);
    const { data: ok, error } = await db.rpc("est_admin_fribouk");
    if (error || !ok) return dire("Cette page est réservée à l'administrateur.", false);
    $("etat").hidden = true; $("contenu").hidden = false;
    chargerDemandes(); chargerFormations();
  }

  async function agir(appel, succes) {
    const { error } = await appel;
    if (error) { $("etat").hidden = false; dire("Action impossible : " + error.message, false); return; }
    $("etat").hidden = false; dire(succes);
    chargerDemandes(); chargerFormations();
  }

  async function chargerDemandes() {
    const z = $("demandes"); z.replaceChildren();
    const { data, error } = await db.from("demandes_formateur").select("*").eq("statut", "en_attente").order("created_at");
    if (error) { z.append(el("p", { class: "doux" }, "Chargement impossible : " + error.message)); return; }
    if (!data.length) { z.append(el("p", { class: "doux" }, "Aucune demande en attente.")); return; }
    for (const d of data) {
      const liens = el("div", {});
      for (const [i, chemin] of (d.preuves || []).entries()) {
        const { data: s } = await db.storage.from("preuves-formateurs").createSignedUrl(chemin, 600);
        if (s && s.signedUrl) liens.append(el("a", { class: "lien", href: s.signedUrl, target: "_blank", rel: "noopener" }, "Preuve " + (i + 1)));
      }
      z.append(el("div", { class: "item" },
        el("h3", {}, d.nom_espace),
        el("p", { class: "doux" }, d.description || "Pas de présentation."),
        el("p", { class: "doux" }, (MODES[d.mode] || d.mode) + " · " + (d.ville || "ville non indiquée") + " · WhatsApp : " + (d.whatsapp || "non indiqué")),
        el("p", { class: "doux" }, "Compte : " + d.user_id.slice(0, 8) + "…"),
        liens,
        el("div", { class: "rang" },
          el("button", { class: "btn", type: "button", onclick: () => agir(db.rpc("approuver_demande", { p_demande: d.id }), "Espace attribué.") }, "Approuver"),
          el("button", { class: "btn contour", type: "button", onclick: () => {
            const motif = prompt("Motif du refus (visible par le formateur) :");
            if (motif === null) return;
            agir(db.rpc("refuser_demande", { p_demande: d.id, p_motif: motif.trim() || "Preuves insuffisantes" }), "Demande refusée.");
          } }, "Refuser"))));
    }
  }

  async function chargerFormations() {
    const z = $("formations"); z.replaceChildren();
    const { data, error } = await db.from("formations").select("*, espaces_formation(nom)").eq("statut", "en_attente").order("created_at");
    if (error) { z.append(el("p", { class: "doux" }, "Chargement impossible : " + error.message)); return; }
    if (!data.length) { z.append(el("p", { class: "doux" }, "Aucune formation en attente.")); return; }
    data.forEach((f) => {
      const lien = f.format !== "presentiel" ? lienSur(f.lien_contenu) : null;
      z.append(el("div", { class: "item" },
        el("h3", {}, f.titre),
        el("p", { class: "doux" }, "Espace : " + (f.espaces_formation ? f.espaces_formation.nom : "?") + " · " + (FORMATS[f.format] || f.format) + " · " + f.duree_heures + " h · " + (f.prix_xof > 0 ? f.prix_xof.toLocaleString("fr-FR") + " FCFA" : "Gratuit")),
        f.categorie ? el("p", { class: "doux" }, "Domaine : " + f.categorie) : null,
        el("p", { class: "doux" }, f.description || "Pas de description."),
        f.format === "presentiel" ? el("p", { class: "doux" }, "Lieu : " + (f.lieu || "")) : null,
        lien ? el("a", { class: "lien", href: lien, target: "_blank", rel: "noopener" }, "Voir le contenu") : null,
        el("div", { class: "rang" },
          el("button", { class: "btn", type: "button", onclick: () => agir(db.rpc("traiter_formation", { p_formation: f.id, p_approuver: true }), "Formation publiée.") }, "Approuver"),
          el("button", { class: "btn contour", type: "button", onclick: () => {
            const motif = prompt("Motif du refus (visible par le formateur) :");
            if (motif === null) return;
            agir(db.rpc("traiter_formation", { p_formation: f.id, p_approuver: false, p_motif: motif.trim() || "Contenu non conforme" }), "Formation refusée.");
          } }, "Refuser"))));
    });
  }

  init();
</script>
</body>
</html>
